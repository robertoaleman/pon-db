[package]
name = "pon-db-engine"
version = "8.4.0"
edition = "2021"
authors = ["Roberto C.Aleman"]
description = "PON V8- database engine encapsulated in a single, portable and strictly encrypted binary format"

[dependencies]
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
ed25519-dalek = "2.2"
machine-uid = "0.3.0"
hex = "0.4" 
indicatif = "0.17"
libc = "0.2"
colored = "2.0"
csv = "1.1"
aes-gcm = "0.10.3"
lz4_flex = "0.11"
getrandom = "0.2"
sha2 = "0.10.8"
sysinfo = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fxhash = "0.2"
bincode = "1.3"
chrono = "0.4"
uuid = { version = "1.6.1", features = ["v4", "fast-rng"] }

[profile.release]
opt-level = "z"    
lto = true          
codegen-units = 1  
panic = "abort"     
